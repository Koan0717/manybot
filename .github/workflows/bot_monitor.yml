name: Bot Switch & Health Monitor

on:
  # 手動実行専用（定期実行は行わない）
  workflow_dispatch:
    inputs:
      target:
        description: '実行するアクションを選択してください'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'switch_to_a'
          - 'switch_to_b'
          - 'restart_active'

jobs:
  switch_and_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Switch or Restart Bot
        env:
          TARGET: ${{ github.event.inputs.target || 'auto' }}
          RENDER_API_KEY_A: ${{ secrets.RENDER_API_KEY_A }}
          RENDER_API_KEY_B: ${{ secrets.RENDER_API_KEY_B }}
          SERVICE_ID_A: ${{ secrets.RENDER_SERVICE_ID_A }}
          SERVICE_ID_B: ${{ secrets.RENDER_SERVICE_ID_B }}
          BOT_HEALTH_URL_A: ${{ secrets.BOT_HEALTH_URL_A }}
          BOT_HEALTH_URL_B: ${{ secrets.BOT_HEALTH_URL_B }}
        run: |
          set -e

          echo "=== Bot Manual Switcher ==="
          echo "Target Action: $TARGET"
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          get_service_status() {
            local api_key=$1
            local service_id=$2
            local response
            response=$(curl -s --max-time 10 \
              -X GET "https://api.render.com/v1/services/${service_id}" \
              -H "Authorization: Bearer ${api_key}" \
              -H "Accept: application/json")
            echo "$response" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              svc = data.get('service', data)
              print(svc.get('suspended', 'unknown'))
          except Exception as e:
              print('error: ' + str(e))
          "
          }

          suspend_service() {
            local api_key=$1
            local service_id=$2
            local label=$3
            echo "  -> ${label} を停止中..."
            curl -s --max-time 10 \
              -X POST "https://api.render.com/v1/services/${service_id}/suspend" \
              -H "Authorization: Bearer ${api_key}" \
              -H "Accept: application/json" > /dev/null
            echo "  OK ${label} を停止しました"
          }

          resume_service() {
            local api_key=$1
            local service_id=$2
            local label=$3
            echo "  -> ${label} を起動中..."
            curl -s --max-time 10 \
              -X POST "https://api.render.com/v1/services/${service_id}/resume" \
              -H "Authorization: Bearer ${api_key}" \
              -H "Accept: application/json" > /dev/null
            echo "  OK ${label} を起動しました"
          }

          redeploy_service() {
            local api_key=$1
            local service_id=$2
            local label=$3
            echo "  -> ${label} を再デプロイ(再起動)中..."
            curl -s --max-time 10 \
              -X POST "https://api.render.com/v1/services/${service_id}/deploys" \
              -H "Authorization: Bearer ${api_key}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}' > /dev/null
            echo "  OK ${label} の再起動をトリガーしました"
          }

          echo ""
          echo "--- Render サービス状態確認 ---"
          STATUS_A=$(get_service_status "$RENDER_API_KEY_A" "$SERVICE_ID_A")
          STATUS_B=$(get_service_status "$RENDER_API_KEY_B" "$SERVICE_ID_B")
          echo "Bot A: $STATUS_A"
          echo "Bot B: $STATUS_B"

          echo ""
          echo "--- 実行処理 ---"

          if [ "$TARGET" = "switch_to_a" ]; then
            echo "【Bot A に切り替え】"
            if [ "$STATUS_B" = "not_suspended" ]; then
              suspend_service "$RENDER_API_KEY_B" "$SERVICE_ID_B" "Bot B"
            fi
            resume_service "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"

          elif [ "$TARGET" = "switch_to_b" ]; then
            echo "【Bot B に切り替え】"
            if [ "$STATUS_A" = "not_suspended" ]; then
              suspend_service "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"
            fi
            resume_service "$RENDER_API_KEY_B" "$SERVICE_ID_B" "Bot B"

          elif [ "$TARGET" = "restart_active" ]; then
            echo "【現在動いているBotを再起動】"
            if [ "$STATUS_A" = "not_suspended" ]; then
              redeploy_service "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"
            elif [ "$STATUS_B" = "not_suspended" ]; then
              redeploy_service "$RENDER_API_KEY_B" "$SERVICE_ID_B" "Bot B"
            else
              echo "両方停止中のため、Bot A を起動します"
              resume_service "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"
            fi

          else
            # auto モード
            echo "【自動切替・起動】"
            if [ "$STATUS_A" = "not_suspended" ] && [ "$STATUS_B" = "not_suspended" ]; then
              echo "両方起動中 -> Bot B を停止して Bot A を優先"
              suspend_service "$RENDER_API_KEY_B" "$SERVICE_ID_B" "Bot B"
            elif [ "$STATUS_A" = "not_suspended" ]; then
              echo "Bot A が現在稼働中です"
            elif [ "$STATUS_B" = "not_suspended" ]; then
              echo "Bot B が現在稼働中です"
            else
              echo "両方停止中 -> Bot A を起動"
              resume_service "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"
            fi
          fi

          echo ""
          echo "=== 処理完了 ==="
