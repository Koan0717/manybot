name: Bot Health Monitor

on:
  schedule:
    # 14分ごとに実行（Renderの15分スリープより前にpingする）
    - cron: '*/14 * * * *'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Keep bots awake (ping to prevent Render sleep)
        env:
          BOT_HEALTH_URL_A: ${{ secrets.BOT_HEALTH_URL_A }}
          BOT_HEALTH_URL_B: ${{ secrets.BOT_HEALTH_URL_B }}
        run: |
          echo "=== スリープ防止ping ==="
          # 稼働中のBotにpingを送ってスリープさせない
          echo "Bot A ping..."
          curl -s -o /dev/null -w "Bot A HTTP: %{http_code}\n" \
            --max-time 30 --connect-timeout 10 "$BOT_HEALTH_URL_A" || echo "Bot A: 応答なし（停止中の可能性）"
          echo "Bot B ping..."
          curl -s -o /dev/null -w "Bot B HTTP: %{http_code}\n" \
            --max-time 30 --connect-timeout 10 "$BOT_HEALTH_URL_B" || echo "Bot B: 応答なし（停止中の可能性）"
          echo "ping完了"

      - name: Check and switch bot if needed
        env:
          RENDER_API_KEY_A: ${{ secrets.RENDER_API_KEY_A }}
          RENDER_API_KEY_B: ${{ secrets.RENDER_API_KEY_B }}
          SERVICE_ID_A: ${{ secrets.RENDER_SERVICE_ID_A }}
          SERVICE_ID_B: ${{ secrets.RENDER_SERVICE_ID_B }}
          BOT_HEALTH_URL_A: ${{ secrets.BOT_HEALTH_URL_A }}
          BOT_HEALTH_URL_B: ${{ secrets.BOT_HEALTH_URL_B }}
        run: |
          set -e

          echo "=== Bot Health Monitor ==="
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          get_service_status() {
            local api_key=$1
            local service_id=$2
            local response
            response=$(curl -s --max-time 10 \
              -X GET "https://api.render.com/v1/services/${service_id}" \
              -H "Authorization: Bearer ${api_key}" \
              -H "Accept: application/json")
            echo "$response" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              svc = data.get('service', data)
              print(svc.get('suspended', 'unknown'))
          except Exception as e:
              print('error: ' + str(e))
          "
          }

          check_health() {
            local url=$1
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 20 --connect-timeout 10 "$url" 2>/dev/null || echo "000")
            echo "$status"
          }

          suspend_service() {
            local api_key=$1
            local service_id=$2
            local label=$3
            echo "  -> ${label} を停止中..."
            curl -s --max-time 10 \
              -X POST "https://api.render.com/v1/services/${service_id}/suspend" \
              -H "Authorization: Bearer ${api_key}" \
              -H "Accept: application/json" > /dev/null
            echo "  OK ${label} を停止しました"
          }

          resume_service() {
            local api_key=$1
            local service_id=$2
            local label=$3
            echo "  -> ${label} を起動中..."
            curl -s --max-time 10 \
              -X POST "https://api.render.com/v1/services/${service_id}/resume" \
              -H "Authorization: Bearer ${api_key}" \
              -H "Accept: application/json" > /dev/null
            echo "  OK ${label} を起動しました"
          }

          echo ""
          echo "--- Render サービス状態確認 ---"
          STATUS_A=$(get_service_status "$RENDER_API_KEY_A" "$SERVICE_ID_A")
          STATUS_B=$(get_service_status "$RENDER_API_KEY_B" "$SERVICE_ID_B")
          echo "Bot A: $STATUS_A"
          echo "Bot B: $STATUS_B"

          echo ""
          echo "--- 判定ロジック ---"

          if [ "$STATUS_A" = "not_suspended" ] && [ "$STATUS_B" = "not_suspended" ]; then
            echo "両方が起動中 -> Bot B を停止してBot A を優先"
            suspend_service "$RENDER_API_KEY_B" "$SERVICE_ID_B" "Bot B"

          elif [ "$STATUS_A" = "not_suspended" ]; then
            echo "Bot A が起動中 -> ヘルスチェック..."
            HEALTH_A=$(check_health "$BOT_HEALTH_URL_A")
            echo "  Bot A HTTP: $HEALTH_A"
            if [ "$HEALTH_A" = "200" ]; then
              echo "Bot A は正常稼働中"
            else
              echo "Bot A が応答なし -> Bot B に切り替え"
              suspend_service "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"
              resume_service  "$RENDER_API_KEY_B" "$SERVICE_ID_B" "Bot B"
            fi

          elif [ "$STATUS_B" = "not_suspended" ]; then
            echo "Bot B が起動中 -> ヘルスチェック..."
            HEALTH_B=$(check_health "$BOT_HEALTH_URL_B")
            echo "  Bot B HTTP: $HEALTH_B"
            if [ "$HEALTH_B" = "200" ]; then
              echo "Bot B は正常稼働中"
            else
              echo "Bot B が応答なし -> Bot A に切り替え"
              suspend_service "$RENDER_API_KEY_B" "$SERVICE_ID_B" "Bot B"
              resume_service  "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"
            fi

          else
            echo "両方が停止中 -> Bot A をフォールバック起動"
            resume_service "$RENDER_API_KEY_A" "$SERVICE_ID_A" "Bot A"
          fi

          echo ""
          echo "=== 監視完了 ==="
